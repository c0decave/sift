[build-system]
# 77 is the first setuptools that reads a PEP 639 license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-summarizer"
version = "0.1.95"
description = "Recognize & summarize files with a local LLM (Ollama / LM Studio / MLX-LM). Offline-first, zero-dependency core."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "ollama", "lm-studio", "summarize", "file", "offline", "local", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = [
    # Only for reading a TOML config file on interpreters older than 3.11,
    # where the standard library has no tomllib. The core is dependency-free.
    'tomli>=1.1.0; python_version < "3.11"',
]

[project.optional-dependencies]
# pypdf 6.18.1: sift bounds what pypdf decodes of a document's structure
# through pypdf's configuration API (apply_configuration, 6.18.0 and later),
# and counts what pypdf 6.18.1 logs and builds reading fonts. Where pypdf
# lacks that API, or is older than 6.18.1, sift does not read with it, and
# says so. sift's tests pass against 6.18.1 and 6.19.0; they fail on 6.18.0.
pdf = ["pypdf>=6.18.1"]
images = ["Pillow>=10"]
yaml = ["PyYAML>=6"]
rich = ["rich>=13"]
all = ["pypdf>=6.18.1", "Pillow>=10", "PyYAML>=6", "rich>=13"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools]
packages = ["sift", "sift.extract", "sift.llm"]

[tool.setuptools.package-data]
# Inside the package: a top-level "webui" directory in
# site-packages is a name any other project could claim.
sift = ["webui/*"]
